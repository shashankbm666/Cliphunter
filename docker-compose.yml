services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cliphunt-postgres
    environment:
      POSTGRES_DB: cliphunt
      POSTGRES_USER: cliphunt
      POSTGRES_PASSWORD: cliphunt
    ports:
      - "5432:5432"
    volumes:
      - cliphunt-postgres:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  cliphunt-postgres:
